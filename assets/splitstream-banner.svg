<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="SplitStream — pooled payouts for contributor waves">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#1b3a5b"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" rx="24" fill="url(#bg)"/>
  <!-- stream motif: three parallel flowing bars -->
  <g fill="url(#stream)" opacity="0.9">
    <rect x="60" y="52" width="90" height="16" rx="8"/>
    <rect x="78" y="112" width="90" height="16" rx="8"/>
    <rect x="60" y="172" width="90" height="16" rx="8"/>
  </g>
  <g fill="#ffffff">
    <text x="200" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="700" letter-spacing="2">SplitStream</text>
  </g>
  <g fill="#9fb6cc">
    <text x="200" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" letter-spacing="6">PAYOUT COMPUTE & RELAY</text>
  </g>
</svg>